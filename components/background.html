<!-- 
=============================================================================
BLOODLINK PREMIUM BACKGROUND COMPONENT
=============================================================================
USAGE:
1. Include `css/bloodlink-background.css` in your <head>.
2. Place this component at the top of <body> (fixed, z-index: -1).
3. Ensure your page content container has `position: relative; z-index: 10;`.
4. Include `js/bloodlink-background.js` before </body>.
5. Trigger pulse at any time via: window.dispatchEvent(new CustomEvent('bloodlink:pulse'))
=============================================================================
-->

<div id="bloodlink-background" data-variant="bloodstream">
    <!-- LAYER 1: Base Gradient & Aurora Blooms -->
    <div class="aurora-bloom aurora-1"></div>
    <div class="aurora-bloom aurora-2"></div>
    
    <!-- LAYER 2: Vein Ribbons -->
    <div class="vein-container">
        <div class="vein-ribbon" style="top: 18%; animation-delay: -5s; opacity: 0.65;"></div>
        <div class="vein-ribbon" style="top: 48%; animation-delay: -15s; opacity: 0.45;"></div>
        <div class="vein-ribbon" style="top: 78%; animation-delay: -2s; opacity: 0.55;"></div>
    </div>

    <!-- LAYER 3: Pulsing Heart Backdrop (SVG) -->
    <div class="heart-container" id="background-heart">
        <svg viewBox="0 0 32 32" class="heart-svg w-full h-full">
            <path d="M16 28.5L14.1 26.8C7.35 20.65 3 16.7 3 11.85C3 7.85 6.15 4.7 10.15 4.7C12.4 4.7 14.55 5.75 16 7.45C17.45 5.75 19.6 4.7 21.85 4.7C25.85 4.7 29 7.85 29 11.85C29 16.7 24.65 20.65 17.9 26.8L16 28.5Z"></path>
        </svg>
    </div>

    <!-- LAYER 4: Interactive Bloodstream Canvas (Erythrocytes) -->
    <canvas id="blood-cells-canvas" class="absolute inset-0 w-full h-full"></canvas>

    <!-- LAYER 5: Dynamic ECG Cardiac Pulse Waveform -->
    <div class="ecg-container">
        <svg width="100%" height="100%" preserveAspectRatio="none">
            <path id="ecg-line" d=""></path>
            <circle id="ecg-marker" class="pulse-marker" r="4.5" cx="-30" cy="50"></circle>
        </svg>
    </div>

    <!-- LAYER 6: Cinematic Vignette & Noise Texture -->
    <div class="vignette"></div>
    <div class="grain"></div>
</div>
